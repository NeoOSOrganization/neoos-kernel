# make ahcitest: QEMU's blkdebug driver fails every read that covers
# sector 4096 of the AHCI scratch disk with EIO. The kernel's scratch
# selftest puts that read among other queued ones and expects exactly it
# to fail (docs/superpowers/specs/2026-09-23-storage-02-ahci-design.md 4.7).
[inject-error]
event = "read_aio"
errno = "5"
sector = "4096"
once = "off"
